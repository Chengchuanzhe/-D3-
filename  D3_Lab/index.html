<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>D3.js 实验 1</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>
    <h1>2组-D3测试</h1>
    <script>
        // 在浏览器控制台打印 D3 版本，验证是否加载成功
        console.log("D3.js 加载成功！版本号：", d3.version);

        // 1. 铺开一张 SVG “画布”
            // 我们使用 D3 的链式语法（像流水线一样一步步操作）
            const svg = d3.select("body")        // 第一步：选中网页的 body 部分
                .append("svg")         // 第二步：在 body 里添加一张 svg 画布
                .attr("width", 1080)    // 第三步：设置画布的宽度为 1920 像素
                .attr("height", 1920)   // 第四步：设置画布的高度为 1080 像素
           

            // 2. 绘制一个矩形 (rect)
            svg.append("rect")
                .attr("x", 50)       // 矩形左上角距离画布左边缘 40 像素
                .attr("y", 70)       // 矩形左上角距离画布上边缘 50 像素
                .attr("width", 100)  // 矩形的宽度
                .attr("height", 60)  // 矩形的高度
                .attr("fill", "blue"); // fill 属性用来控制填充颜色（这里用钢蓝色）

            // 3. 绘制一个圆形 (circle)
            svg.append("circle")
                .attr("cx", 350)     // 圆心的 X 坐标 (Center X)
                .attr("cy", 100)      // 圆心的 Y 坐标 (Center Y)
                .attr("r", 50)       // 圆的半径 (Radius)
                .attr("fill", "tomato");    // 番茄红

            // 4. 绘制一个椭圆 (ellipse)
            svg.append("ellipse")
                .attr("cx", 650)     // 椭圆中心的 X 坐标
                .attr("cy", 100)      // 椭圆中心的 Y 坐标
                .attr("rx", 60)      // 水平方向的半径 (Radius X)
                .attr("ry", 30)      // 垂直方向的半径 (Radius Y)
                .attr("fill", "mediumseagreen"); // 海洋绿
    </script>
</body>

</html>
