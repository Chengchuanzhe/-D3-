<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>海气耦合可视化 - 温度折线图</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .line-air { fill: none; stroke: steelblue; stroke-width: 2px; }
        .line-sea { fill: none; stroke: tomato; stroke-width: 2px; }
        .axis-label { font-size: 12px; fill: #333; }
    </style>
</head>
<body>
    <h2>2024年初东海海域海气温度趋势对比</h2>
    <div id="chart"></div>

    <script>
        // 1. 设置画布尺寸和边距 (Margin 约定，为了给坐标轴留出空间)
        const margin = {top: 40, right: 50, bottom: 50, left: 50};
        const width = 800 - margin.left - margin.right;
        const height = 400 - margin.top - margin.bottom;

        // 在页面中添加 SVG 画布
        const svg = d3.select("#chart")
                      .append("svg")
                      .attr("width", width + margin.left + margin.right)
                      .attr("height", height + margin.top + margin.bottom)
                      .append("g") // 添加一个分组，整体平移留出边距
                      .attr("transform", `translate(${margin.left},${margin.top})`);

        // 2. 读取我们清洗好的 JSON 数据
        d3.json("coupled_data.json").then(function(data) {
            
            // 数据预处理：把字符串格式的日期 ("2024-01-02") 转换为 D3 认识的日期对象
            const parseTime = d3.timeParse("%Y-%m-%d");
            data.forEach(d => {
                d.parsedDate = parseTime(d.date);
            });

            // 3. 定义比例尺
            // X 轴比例尺：时间比例尺
            const x = d3.scaleTime()
                        .domain(d3.extent(data, d => d.parsedDate)) // 取日期的最小值和最大值
                        .range([0, width]); // 映射到画布宽度

            // Y 轴比例尺：线性比例尺 (由于网页 Y 轴向下，所以 range 是反过来的 height 到 0)
            // 为了让图表更好看，我们找出气温和海温中的最低和最高值
            const minTemp = d3.min(data, d => Math.min(d.air_temp, d.sea_temp)) - 2;
            const maxTemp = d3.max(data, d => Math.max(d.air_temp, d.sea_temp)) + 2;
            const y = d3.scaleLinear()
                        .domain([minTemp, maxTemp])
                        .range([height, 0]);

            // 4. 绘制坐标轴
            // 底部 X 轴
            svg.append("g")
               .attr("transform", `translate(0,${height})`) // 把 X 轴推到底部
               .call(d3.axisBottom(x).ticks(8)); // ticks 建议显示 8 个刻度

            // 左侧 Y 轴
            svg.append("g")
               .call(d3.axisLeft(y));

            // 添加 Y 轴单位标签
            svg.append("text")
               .attr("class", "axis-label")
               .attr("x", -10)
               .attr("y", -10)
               .text("温度 (°C)");

            // 5. 定义折线生成器
            // 气温折线生成器
            const valuelineAir = d3.line()
                                   .x(d => x(d.parsedDate))
                                   .y(d => y(d.air_temp));

            // 海温折线生成器
            const valuelineSea = d3.line()
                                   .x(d => x(d.parsedDate))
                                   .y(d => y(d.sea_temp));

            // 6. 绑定数据并绘制路径 (Path)
            // 画气温线 (蓝色)
            svg.append("path")
               .data([data]) // 折线图绑定数据必须加中括号，把它当成一个整体数组
               .attr("class", "line-air")
               .attr("d", valuelineAir);

            // 画海温线 (红色)
            svg.append("path")
               .data([data])
               .attr("class", "line-sea")
               .attr("d", valuelineSea);

        }).catch(function(error) {
            console.error("数据加载失败:", error);
        });
    </script>
</body>
</html>
