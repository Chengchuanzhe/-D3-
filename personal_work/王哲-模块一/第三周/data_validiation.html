<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>成员一王哲：多图联动数据同步校验</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .dashboard { display: flex; flex-direction: column; gap: 20px; }
        .control-panel { padding: 10px; background: #f5f5f5; border-radius: 8px; }
        #test-svg { border: 1px dashed #ccc; background: #fafafa; }
    </style>
</head>

<body>
    <div class="dashboard">
        <h3>全局数据流转测试控制台 (环境搭建与数据治理)</h3>
        
        <div class="control-panel">
            <label for="region-filter"><strong>选择校验海域：</strong></label>
            <select id="region-filter">
                <option value="all">全部海域 (All)</option>
                <option value="台湾海峡">台湾海峡</option>
                <option value="南海北部">南海北部</option>
                <option value="渤海">渤海</option>
                <option value="黄海">黄海</option>
                <option value="东海">东海</option>
            </select>
        </div>

        <div>
            <h4>个性化图表测试区 (气泡散点图)</h4>
            <p style="font-size: 12px; color: #888;">测试说明：X轴映射时间，Y轴映射气温(air_temp)，圆的半径映射风速(wind_speed)</p>
            <svg id="test-svg" width="800" height="400"></svg>
        </div>
    </div>

    <script>
        // 1. 初始化SVG与比例尺
        const svg = d3.select("#test-svg");
        const width = +svg.attr("width");
        const height = +svg.attr("height");
        const margin = { top: 20, right: 20, bottom: 30, left: 40 };

        const xScale = d3.scaleTime().range([margin.left, width - margin.right]);
        const yScale = d3.scaleLinear().range([height - margin.bottom, margin.top]);
        const rScale = d3.scaleSqrt().range([2, 12]); // 使用平方根比例尺映射面积/半径更科学
        const colorScale = d3.scaleOrdinal(d3.schemeCategory10);

        // 2. 核心数据广播与渲染更新函数
        // 职责：模拟向其他团队成员的图表分发过滤后的干净数据
        function broadcastAndUpdate(filteredData, regionName) {
            // 【关键核查点】：向控制台广播当前共享的数据集状态
            console.log(`\n========== 数据同步触发 ==========`);
            console.log(`当前作用域: [${regionName}]`);
            console.log(`传递给柱状图/折线图的数据条数: ${filteredData.length}`);
            if(filteredData.length > 0) {
                console.log("数据样本抽查 (包含清洗后的数值与时间对象):", filteredData[0]);
            }
            
            // 派发自定义全局事件，其他成员可以通过 window.addEventListener('dataReady', ...) 监听
            window.dispatchEvent(new CustomEvent('dataReady', { detail: filteredData }));

            // --- 个性化图表渲染测试 ---
            
            // 更新比例尺定义域 
            if(filteredData.length === 0) return;
            
            xScale.domain(d3.extent(filteredData, d => d.parsedDate));
            yScale.domain(d3.extent(filteredData, d => d.air_temp));
            rScale.domain(d3.extent(filteredData, d => d.wind_speed));

            // 使用 D3 v7 的 .join() 模式进行数据绑定与DOM更新
            svg.selectAll("circle.data-point")
                // 使用 date + region 作为 key，确保动画平滑过渡
                .data(filteredData, d => d.date + "_" + d.region_name) 
                .join(
                    enter => enter.append("circle")
                        .attr("class", "data-point")
                        .attr("cx", d => xScale(d.parsedDate) || margin.left)
                        .attr("cy", d => yScale(d.air_temp) || height/2)
                        .attr("r", 0) // 初始半径为0，用于入场动画
                        .attr("fill", d => colorScale(d.region_name))
                        .attr("opacity", 0.6)
                        .call(enter => enter.transition().duration(800)
                            .attr("r", d => rScale(d.wind_speed) || 2)
                        ),
                    update => update
                        .call(update => update.transition().duration(800)
                            .attr("cx", d => xScale(d.parsedDate))
                            .attr("cy", d => yScale(d.air_temp))
                            .attr("r", d => rScale(d.wind_speed))
                        ),
                    exit => exit
                        .call(exit => exit.transition().duration(800)
                            .attr("r", 0)
                            .remove()
                        )
                );
        }

        // 3. 独立编写 D3.js 数据加载代码
        d3.json("../../../Data.json").then(function (data) {
            console.log("原始数据加载成功，总条数:", data.length);

            // 数据预处理与健壮性清洗
            const parseTime = d3.timeParse("%Y-%m-%d");
            
            data.forEach(d => {
                // 1. 时间清洗：确保格式正确
                d.parsedDate = parseTime(d.date) || new Date(); 
                
                // 2. 数值清洗：强制类型转换 (+)，如果遇到NaN或null则赋予默认安全值 0
                d.wind_speed = +d.wind_speed || 0; 
                d.air_temp = +d.air_temp || 0;
                d.sea_temp = +d.sea_temp || 0;
            });

            // 初始化首次渲染与广播
            broadcastAndUpdate(data, "all");

            // 4. 多图联动事件监听
            d3.select("#region-filter").on("change", function () {
                const selectedRegion = d3.select(this).property("value");
                let filteredData = data;

                // 数据切片逻辑
                if (selectedRegion !== "all") {
                    filteredData = data.filter(d => d.region_name === selectedRegion);
                }

                // 调用全局渲染与广播
                broadcastAndUpdate(filteredData, selectedRegion);
            });

        }).catch(error => {
            console.error("数据加载失败!", error);
        });
    </script>
</body>

</html>
