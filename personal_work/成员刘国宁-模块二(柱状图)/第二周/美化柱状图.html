<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>气象气压趋势 · 美化柱状图</title>
    <!-- 引入 D3.js v7 -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="chart-card">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap;">
        <div>
            <h1>大气压力变化趋势</h1>
            <div class="sub">日平均海平面气压</div>
        </div>
    </div>
    <div id="chart">
    </div>
    <footer>单位: hPa (百帕) &nbsp;|&nbsp; 柱子越⾼代表气压越强</footer>
</div>

<script>
    d3.json("pressure-day.json").then(function(data){
            margin = {top: 20, right: 30, bottom: 40, left: 40};
            width =  800- margin.left - margin.right;
            height = 400 - margin.top - margin.bottom;
            pressure = data.pressure;
            const days = data.day
            max = d3.max(pressure); 
            min = d3.min(pressure);
            const parseDate = d3.timeParse("%Y-%m-%d");
            const dates = data.day.map(d => parseDate(d));
            const record = data.day.map((day,i) => ({day:dates[i],pressure:data.pressure[i]}))
            const svg = d3.select("#chart").append("svg").attr("width",width+margin.left+margin.right).attr("height",height+margin.top+margin.bottom);
            const x = d3.scaleTime().domain(d3.extent(dates)).range([margin.left,margin.left+width]);
            const y = d3.scaleLinear().domain([min-10, max]).range([margin.top+height,margin.top]);
            svg.selectAll(".bar").data(record).enter().append("rect").attr("class","bar").attr("x",(d) => x(d.day)-2.5).attr("y",(d) => y(d.pressure)).attr("width",(d,i) => i === 0 ? 0:5).attr("height",(d) => height - y(d.pressure) + margin.top).attr("fill","steelblue");
            svg.append("g").attr("class","x-axis").attr("transform","translate(0," + (margin.top+height) + ")").call(d3.axisBottom(x).ticks(d3.timeDay.every(4)).tickFormat(d3.timeFormat("%m-%d")));
            svg.append("g").attr("class","y-axis").attr("transform","translate(" + margin.left + ",0)").call(d3.axisLeft(y));
       })
</script>
</body>
</html>
