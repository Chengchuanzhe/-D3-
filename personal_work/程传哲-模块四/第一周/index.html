<!-- # 2组 - 程传哲 - 第一周 - 基础图形 + 基础交互测试 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2组-程传哲-第一周-基础图形与交互</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 24px;
            font-family: "Microsoft YaHei", sans-serif;
            background: #f6f8fb;
            color: #1f2a44;
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
        }

        p {
            margin: 0 0 16px 0;
            color: #4a587a;
        }

        #chart {
            width: 860px;
            max-width: 100%;
            border: 1px solid #d7deed;
            border-radius: 10px;
            background: #ffffff;
            padding: 8px;
        }

        .shape {
            cursor: pointer;
            pointer-events: all;
            transition: opacity 0.2s ease, fill 0.2s ease;
        }
    </style>
</head>
<body>
    <h1>第1周：基础图形 + 基础交互测试</h1>
    <p>测试项：D3加载、SVG绘制（矩形/圆/椭圆）、鼠标悬浮变色、点击隐藏/显示。</p>
    <div id="chart"></div>

    <script>
        // # 2组 - 程传哲 - 第一周 - 基础图形 + 基础交互测试
        console.log("D3.js loaded:", d3.version);

        const width = 820;
        const height = 340;

        const svg = d3.select("#chart")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const items = [
            {
                kind: "rect",
                key: "rect",
                x: 80,
                y: 120,
                width: 180,
                height: 90,
                fill: "#2e86de",
                hover: "#54a0ff"
            },
            {
                kind: "circle",
                key: "circle",
                cx: 410,
                cy: 165,
                r: 55,
                fill: "#ff6b6b",
                hover: "#ff9f9f"
            },
            {
                kind: "ellipse",
                key: "ellipse",
                cx: 680,
                cy: 165,
                rx: 80,
                ry: 45,
                fill: "#10ac84",
                hover: "#4cd3b2"
            }
        ];

        function bindBasicEvents(selection) {
            selection
                .on("mouseenter", function(event, d) {
                    d3.select(this).attr("fill", d.hover);
                })
                .on("mouseleave", function(event, d) {
                    d3.select(this).attr("fill", d.fill);
                })
                .on("click", function(event, d) {
                    const el = d3.select(this);
                    const current = Number(el.attr("opacity") || 1);
                    el.attr("opacity", current === 1 ? 0 : 1);
                });
        }

        const rect = svg.selectAll(".shape-rect")
            .data(items.filter(d => d.kind === "rect"))
            .enter()
            .append("rect")
            .attr("class", "shape shape-rect")
            .attr("x", d => d.x)
            .attr("y", d => d.y)
            .attr("width", d => d.width)
            .attr("height", d => d.height)
            .attr("fill", d => d.fill);

        const circle = svg.selectAll(".shape-circle")
            .data(items.filter(d => d.kind === "circle"))
            .enter()
            .append("circle")
            .attr("class", "shape shape-circle")
            .attr("cx", d => d.cx)
            .attr("cy", d => d.cy)
            .attr("r", d => d.r)
            .attr("fill", d => d.fill);

        const ellipse = svg.selectAll(".shape-ellipse")
            .data(items.filter(d => d.kind === "ellipse"))
            .enter()
            .append("ellipse")
            .attr("class", "shape shape-ellipse")
            .attr("cx", d => d.cx)
            .attr("cy", d => d.cy)
            .attr("rx", d => d.rx)
            .attr("ry", d => d.ry)
            .attr("fill", d => d.fill);

        bindBasicEvents(rect);
        bindBasicEvents(circle);
        bindBasicEvents(ellipse);
        // # 2组 - 程传哲 - 第一周 - 基础图形 + 基础交互测试end
    </script>
</body>
</html>
<!-- # 2组 - 程传哲 - 第一周 - 基础图形 + 基础交互测试end -->
