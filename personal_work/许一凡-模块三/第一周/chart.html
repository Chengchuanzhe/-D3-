<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>海气耦合可视化 - 温度折线图</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .line-air { fill: none; stroke: steelblue; stroke-width: 2px; }
        .line-sea { fill: none; stroke: tomato; stroke-width: 2px; }
        .axis-label { font-size: 12px; fill: #333; }
    </style>
</head>
<body>
    <h2>2024年初东海海域海气温度趋势对比</h2>
    <div id="chart"></div>

    <script>
        // 画布
        const margin = {top: 40, right: 50, bottom: 50, left: 50};
        const width = 800 - margin.left - margin.right;
        const height = 400 - margin.top - margin.bottom;

        // SVG 
        const svg = d3.select("#chart")
                      .append("svg")
                      .attr("width", width + margin.left + margin.right)
                      .attr("height", height + margin.top + margin.bottom)
                      .append("g") // 留出边距
                      .attr("transform", `translate(${margin.left},${margin.top})`);

        // 读取数据
        d3.json("coupled_data.json").then(function(data) {
            
            const parseTime = d3.timeParse("%Y-%m-%d");
            data.forEach(d => {
                d.parsedDate = parseTime(d.date);
            });

            const x = d3.scaleTime()
                        .domain(d3.extent(data, d => d.parsedDate)) 
                        .range([0, width]); 

            const minTemp = d3.min(data, d => Math.min(d.air_temp, d.sea_temp)) - 2;
            const maxTemp = d3.max(data, d => Math.max(d.air_temp, d.sea_temp)) + 2;
            const y = d3.scaleLinear()
                        .domain([minTemp, maxTemp])
                        .range([height, 0]);

            svg.append("g")
               .attr("transform", `translate(0,${height})`) 
               .call(d3.axisBottom(x).ticks(8)); 

            svg.append("g")
               .call(d3.axisLeft(y));

            svg.append("text")
               .attr("class", "axis-label")
               .attr("x", -10)
               .attr("y", -10)
               .text("温度 (°C)");

            const valuelineAir = d3.line()
                                   .x(d => x(d.parsedDate))
                                   .y(d => y(d.air_temp));

            const valuelineSea = d3.line()
                                   .x(d => x(d.parsedDate))
                                   .y(d => y(d.sea_temp));

            // 气温线-蓝色                      
            svg.append("path")
               .data([data])
               .attr("class", "line-air")
               .attr("d", valuelineAir);

            // 海温线-红色
            svg.append("path")
               .data([data])
               .attr("class", "line-sea")
               .attr("d", valuelineSea);

        }).catch(function(error) {
            console.error("数据加载失败:", error);
        });
    </script>
</body>
</html>
