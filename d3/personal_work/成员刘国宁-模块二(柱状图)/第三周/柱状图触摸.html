<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>动态气压趋势 · 柱状图 | 仅柱子触发交互</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="chart-card">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap;">
        <div>
            <h1>大气压力变化趋势 · 动态更新</h1>
            <div class="sub">台湾海峡日平均海平面气压</div>
        </div>
    </div>
    <div id="chart"></div>
    <footer>单位: hPa (百帕) &nbsp;</footer>
</div>

<script>
    // ---------- 全局变量 ----------
    let currentRecords = [];      // [{day, pressure}]
    let svg, xScale, yScale, width, height, margin;
    let tooltipDiv, crosshairXLine, crosshairYLine, dataPointCircle;
    let isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    let activeBarElement = null;
    let currentHighlightedData = null;

    // ---------- 隐藏所有交互元素 ----------
    function hideAllInteractions() {
        if (tooltipDiv) tooltipDiv.classed("visible", false);
        if (crosshairXLine) {
            crosshairXLine.classed("visible", false);
            crosshairYLine.classed("visible", false);
        }
        if (dataPointCircle) dataPointCircle.classed("visible", false);
        if (activeBarElement) {
            d3.select(activeBarElement)
                .attr("fill", "steelblue")
                .classed("active", false);
            activeBarElement = null;
        }
        currentHighlightedData = null;
    }

    // 高亮指定柱子 (基于数据对象)
    function highlightBar(dataPoint) {
        if (!dataPoint) return;
        if (currentHighlightedData && currentHighlightedData.day.getTime() === dataPoint.day.getTime()) return;
        
        if (activeBarElement) {
            d3.select(activeBarElement)
                .attr("fill", "steelblue")
                .classed("active", false);
            activeBarElement = null;
        }
        
        const allBars = svg.selectAll(".bar");
        let matched = null;
        allBars.each(function(barD) {
            if (barD && barD.day.getTime() === dataPoint.day.getTime()) {
                matched = this;
            }
        });
        if (matched) {
            d3.select(matched)
                .attr("fill", "#f97316")
                .classed("active", true);
            activeBarElement = matched;
            currentHighlightedData = dataPoint;
        }
    }

    // 更新十字准星和数据点
    function updateCrosshairAndDot(dataPoint) {
        if (!dataPoint) return;
        const cx = xScale(dataPoint.day);
        const cy = yScale(dataPoint.pressure);
        crosshairXLine.attr("y1", cy).attr("y2", cy).classed("visible", true);
        crosshairYLine.attr("x1", cx).attr("x2", cx).classed("visible", true);
        dataPointCircle.attr("cx", cx).attr("cy", cy).classed("visible", true);
    }

    // 显示提示框 (传入数据点和鼠标)
    function showTooltip(dataPoint, clientX, clientY) {
        if (!dataPoint) return;
        const formatDate = d3.timeFormat("%Y年%m月%d日");
        tooltipDiv.html(`
            <div class="tooltip-date">📅 ${formatDate(dataPoint.day)}</div>
            <div>
                <span class="tooltip-value">${dataPoint.pressure.toFixed(1)}</span>
                <span class="tooltip-unit">hPa</span>
            </div>
        `);
        
        const tooltipNode = tooltipDiv.node();
        const tooltipRect = tooltipNode.getBoundingClientRect();
        let left = clientX - tooltipRect.width / 2;
        let top = clientY - tooltipRect.height - 18;
        
        if (left < 8) left = 8;
        if (left + tooltipRect.width > window.innerWidth - 8) {
            left = window.innerWidth - tooltipRect.width - 8;
        }
        if (top < 10) {
            top = clientY + 20;
        }
        if (top + tooltipRect.height > window.innerHeight - 10) {
            top = window.innerHeight - tooltipRect.height - 10;
        }
        
        tooltipDiv.style("left", left + "px")
            .style("top", top + "px")
            .classed("visible", true);
    }

    // ========== 只为柱子绑定事件（遮罩层完全不参与交互） ==========
    function bindBarEvents() {
        // 鼠标事件
        svg.selectAll(".bar")
            .on("mouseenter", function(event, d) {
                event.stopPropagation();
                highlightBar(d);
                updateCrosshairAndDot(d);
                showTooltip(d, event.clientX, event.clientY);
            })
            .on("mousemove", function(event, d) {
                // 跟随鼠标移动提示框
                showTooltip(d, event.clientX, event.clientY);
            })
            .on("mouseleave", function() {
                hideAllInteractions();
            });
    }

    // ---------- 核心绘图函数（每次数据更新时调用）----------
    function updateChart(newRecords) {
        if (!svg || !newRecords.length) return;
        currentRecords = [...newRecords];
        
        // 更新比例尺
        const pressures = currentRecords.map(d => d.pressure);
        yScale.domain([d3.min(pressures) - 2, d3.max(pressures) + 1]);
        xScale.domain(d3.extent(currentRecords, d => d.day));
        
        // 计算柱宽
        let barWidth = 6;
        if (currentRecords.length >= 2) {
            const pixelDist = Math.abs(xScale(currentRecords[1].day) - xScale(currentRecords[0].day));
            barWidth = Math.max(5, Math.min(40, pixelDist * 0.65));
        } else if (currentRecords.length === 1) {
            barWidth = 20;
        }
        
        // 数据绑定
        const bars = svg.selectAll(".bar").data(currentRecords, d => d.day);
        bars.exit().transition().duration(400).attr("height", 0).attr("y", yScale(0)).remove();
        
        const enterBars = bars.enter()
            .append("rect")
            .attr("class", "bar")
            .attr("x", d => xScale(d.day) - barWidth/2)
            .attr("y", yScale(0))
            .attr("width", barWidth)
            .attr("height", 0)
            .attr("fill", "steelblue")
            .attr("rx", 3);
        
        const merged = enterBars.merge(bars);
        merged.transition().duration(600).ease(d3.easeCubicOut)
            .attr("x", d => xScale(d.day) - barWidth/2)
            .attr("y", d => yScale(d.pressure))
            .attr("height", d => Math.max(0, margin.top + height - yScale(d.pressure)))
            .attr("width", barWidth)
            .attr("fill", "steelblue");
        
        // 更新坐标轴
        const xAxis = d3.axisBottom(xScale).ticks(d3.timeDay.every(31)).tickFormat(d3.timeFormat("%y-%m-%d"));
        const yAxis = d3.axisLeft(yScale).ticks(6);
        svg.select(".x-axis").transition().duration(600).call(xAxis);
        svg.select(".y-axis").transition().duration(600).call(yAxis);
        svg.select(".grid").transition().duration(600)
            .call(d3.axisLeft(yScale).ticks(6).tickSize(-width).tickFormat(""));
        
        // 重新绑定柱子事件（确保新生成的柱子也有交互）
        bindBarEvents();
    }
    
    // ---------- 初始化图表结构 ----------
    function initChart(rawData) {
        margin = { top: 25, right: 30, bottom: 45, left: 48 };
        width = 800 - margin.left - margin.right;
        height = 420 - margin.top - margin.bottom;
        
        const parseDate = d3.timeParse("%Y-%m-%d");
        const records = rawData.day.map((d, i) => ({
            day: parseDate(d),
            pressure: rawData.pressure[i]
        }));
        currentRecords = records;
        
        tooltipDiv = d3.select("body").append("div").attr("class", "tooltip");
        
        svg = d3.select("#chart")
            .append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .style("display", "block")
            .style("margin", "0 auto");
        
        xScale = d3.scaleTime()
            .domain(d3.extent(records, d => d.day))
            .range([margin.left, margin.left + width]);
        
        const pressures = records.map(d => d.pressure);
        yScale = d3.scaleLinear()
            .domain([d3.min(pressures)-2, d3.max(pressures)+1])
            .range([margin.top + height, margin.top]);
        
        svg.append("g").attr("class", "x-axis").attr("transform", `translate(0, ${margin.top+height})`);
        svg.append("g").attr("class", "y-axis").attr("transform", `translate(${margin.left}, 0)`);
        svg.append("g").attr("class", "grid").attr("transform", `translate(${margin.left}, 0)`);
        
        // 十字准星组
        const crossGroup = svg.append("g");
        crosshairXLine = crossGroup.append("line").attr("class", "crosshair")
            .attr("x1", margin.left).attr("x2", margin.left+width).attr("y1", 0).attr("y2", 0);
        crosshairYLine = crossGroup.append("line").attr("class", "crosshair")
            .attr("x1", 0).attr("x2", 0).attr("y1", margin.top).attr("y2", margin.top+height);
        dataPointCircle = svg.append("circle").attr("class", "data-point").attr("r", 7);
        
        // 注意：不再创建交互遮罩层，因此图表空白区域不会有任何交互反馈
        updateChart(currentRecords);
    }
    
    // ---------- 数据加载 ----------
    d3.json("pressure-day.json").then(raw => {
        if (!raw || !raw.day || !raw.pressure) throw new Error("数据格式错误");
        initChart(raw);
    }).catch(err => {
        console.error("加载失败", err);
    });
</script>
</body>
</html>
